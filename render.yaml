# SAQIB-MD — Render Blueprint
# One-click deploy: https://render.com/deploy?repo=https://github.com/sadsaqib11-boop/SAQIB-MD
# Free plan works, but the service sleeps after ~15 min idle (upgrade to Starter for 24/7).
services:
  - type: web
    name: saqib-md
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: MODE
        value: public          # public = sab use kar sakte hain | private = sirf owner
      - key: MAX_SESSIONS
        value: 50              # 50 tak numbers link ho sakte hain
      - key: BOT_NAME
        value: SAQIB-MD
      - key: OWNER_NAME
        value: Saqib
      - key: OWNER_NUMBER
        value: ""              # khali chhoro -> pehla linked number khud owner ban jayega
      # --- saare auto/anti features DEFAULT OFF ---
      - key: AUTO_READ
        value: "false"
      - key: AUTO_TYPING
        value: "false"
      - key: AUTO_REACT
        value: "false"
      - key: ANTIDELETE
        value: "false"
      - key: ANTIDELETE_INBOX
        value: "false"
      - key: ANTILINK
        value: "false"
      - key: ANTISPAM
        value: "false"
      - key: ANTICALL
        value: "false"
      - key: CHATBOT
        value: "false"
      - key: ONLINE
        value: "false"
    disk:
      name: saqib-sessions
      mountPath: /app/session
      sizeGB: 1
